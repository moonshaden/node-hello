---
# cPanel Git Version Control deployment.
#
# Runs on the server after a pull, so it needs no outbound connection from
# anywhere else. Copies code only: leo-app/data/ and leo-app/config.php are
# never touched, because the first is edited through /admin and the second
# holds the admin password.
deployment:
  tasks:
    - export DEPLOYPATH=/home/leofoundationusa
    - /bin/mkdir -p $DEPLOYPATH/leo-app/src $DEPLOYPATH/leo-app/views/admin
    - /bin/mkdir -p $DEPLOYPATH/public_html/css $DEPLOYPATH/public_html/js
    - /bin/mkdir -p $DEPLOYPATH/public_html/img/recipients $DEPLOYPATH/public_html/img/board

    - /bin/cp -R php/leo-app/src/. $DEPLOYPATH/leo-app/src/
    - /bin/cp -R php/leo-app/views/. $DEPLOYPATH/leo-app/views/
    - /bin/cp php/leo-app/boot.php $DEPLOYPATH/leo-app/boot.php
    - /bin/cp php/leo-app/config.example.php $DEPLOYPATH/leo-app/config.example.php
    - /bin/cp php/leo-app/.htaccess $DEPLOYPATH/leo-app/.htaccess

    - /bin/cp -R php/public_html/css/. $DEPLOYPATH/public_html/css/
    - /bin/cp -R php/public_html/js/. $DEPLOYPATH/public_html/js/
    - /bin/cp -R php/public_html/img/. $DEPLOYPATH/public_html/img/
    - /bin/cp php/public_html/index.php $DEPLOYPATH/public_html/index.php
    - /bin/cp php/public_html/.htaccess $DEPLOYPATH/public_html/.htaccess
